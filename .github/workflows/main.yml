name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./backend
      run: npm install
    - name: Run tests
      working-directory: ./backend
      run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
    - name: Build
      working-directory: ./frontend
      run: npm run build

  build-docker-images:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Backend Image
      run: docker build -t wakalati-backend ./backend
    - name: Build Frontend Image
      run: docker build -t wakalati-frontend ./frontend
    - name: Build AI Service Image
      run: docker build -t wakalati-ai ./ai_service
